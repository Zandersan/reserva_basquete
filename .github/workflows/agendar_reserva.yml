name: Agendamento Reserva Basquete

on:
  schedule:
    - cron: '0 8,11,14,17,20 * * *'  # Horários UTC (5h, 8h, 11h, 14h, 17h BRT)
  workflow_dispatch:

jobs:
  reserva:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install selenium

      - name: Install Chromium and ChromeDriver
        run: |
          # Install Chromium browser
          sudo apt-get update
          sudo apt-get install -y chromium-browser
          
          # Get installed Chromium version
          CHROME_VERSION=$(chromium-browser --version | grep -oP 'Chromium \K\d+')
          echo "Installed Chromium version: $CHROME_VERSION"
          
          # Install matching ChromeDriver
          # Note: For Chromium 137+, we'll use the ChromeDriver for Chrome 137
          wget https://edgedl.me.gvt1.com/edgedl/chrome/chrome-for-testing/$CHROME_VERSION.0.0.0/linux64/chromedriver-linux64.zip
          unzip chromedriver-linux64.zip
          sudo mv chrome-for-testing/$CHROME_VERSION.0.0.0/linux64/chromedriver /usr/local/bin/
          sudo chmod +x /usr/local/bin/chromedriver
          chromedriver --version

      - name: Executar script (reserva.py)
        run: |
          export DISPLAY=:0
          python reserva.py

      - name: Upload de logs (opcional)
        if: always()
        uses: actions/upload-artifact@v4  # Versão atualizada para v4
        with:
          name: logs-reserva
          path: |
            agendados.txt
            *.png