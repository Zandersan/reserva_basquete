name: Agendar Reserva

on:
  schedule:
    - cron: '0 6,9,12,15,18 * * *' # Executa às 06:00, 09:00, 12:00, 15:00 e 18:00 UTC todos os dias
  workflow_dispatch:

jobs:
  reserva:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install selenium

      - name: Instalar Google Chrome
        run: |
          sudo apt-get update
          wget -q -O - https://dl.google.com/linux/linux_signing_key.pub | sudo apt-key add -
          echo "deb [arch=amd64] http://dl.google.com/linux/chrome/deb/ stable main" | sudo tee /etc/apt/sources.list.d/google-chrome.list
          sudo apt-get update
          sudo apt-get install -y google-chrome-stable

      - name: Instalar Chromedriver compatível
        run: |
          set -e
          # Descobrir a versão instalada do Chrome
          CHROME_VERSION=$(google-chrome --version | grep -oP '\d+\.\d+\.\d+\.\d+')
          CHROMEDRIVER_VERSION=$(curl -s "https://googlechromelabs.github.io/chrome-for-testing/last-known-good-versions-with-downloads.json" | \
            python3 -c "import sys, json; v='$CHROME_VERSION'.rsplit('.', 1)[0]; d=json.load(sys.stdin)['channels']['Stable']['downloads']['chromedriver']; print([i['version'] for i in d if i['version'].startswith(v)][0])")
          # Baixar e instalar o chromedriver correspondente
          wget -O chromedriver.zip "https://edgedl.me.gvt1.com/edgedl/chrome/chrome-for-testing/${CHROMEDRIVER_VERSION}/linux64/chromedriver-linux64.zip"
          unzip chromedriver.zip
          sudo mv chromedriver-linux64/chromedriver /usr/local/bin/chromedriver
          sudo chmod +x /usr/local/bin/chromedriver

      - name: Executar script com tentativas
        run: |
          export DISPLAY=:0
          for i in {1..3}; do
            echo "Tentativa $i/3"
            if python reserva.py; then
              echo "Script executado com sucesso"
              break
            else
              echo "Falhou, tentando novamente..."
              sleep 5
            fi
          done
