name: Agendamento Reserva Basquete

on:
  schedule:
    - cron: '0 8,11,14,17,20 * * *'  # Horários UTC (5h, 8h, 11h, 14h, 17h BRT)
  workflow_dispatch:

jobs:
  reserva:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install selenium

      - name: Install Chromium and ChromeDriver
        run: |
          # Install Chromium browser (non-snap version)
          sudo apt-get update
          sudo apt-get install -y chromium-browser
          
          # Get installed Chromium major version
          CHROME_MAJOR_VERSION=$(chromium-browser --version | grep -oP 'Chromium \K\d+')
          echo "Installed Chromium version: $CHROME_MAJOR_VERSION"
          
          # Install ChromeDriver from Ubuntu repositories
          sudo apt-get install -y chromium-chromedriver
          sudo ln -s /usr/lib/chromium-browser/chromedriver /usr/local/bin/chromedriver
          
          # Verify installation
          chromedriver --version

      - name: Executar script (reserva.py)
        run: |
          export DISPLAY=:0
          python reserva.py

      - name: Upload de logs (opcional)
        if: always()
        uses: actions/upload-artifact@v4  # Versão atualizada para v4
        with:
          name: logs-reserva
          path: |
            agendados.txt
            *.png