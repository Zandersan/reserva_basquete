on:
  schedule:
    - cron: '0 3,11,15 * * *'
  workflow_dispatch:

jobs:
  reserva:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Instalar dependências do Chrome Headless
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libnss3 \
            libxi6 \
            libxcursor1 \
            libxcomposite1 \
            libxdamage1 \
            libxrandr2 \
            libasound2t64 \
            libatk1.0-0 \
            libcups2 \
            libxss1 \
            libxshmfence1 \
            libdbus-1-3 \
            libgbm1

      - name: Configurar Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Instalar dependências Python
        run: |
          python -m pip install --upgrade pip
          pip install selenium

      - name: Instalar Google Chrome
        run: |
          wget -q -O - https://dl.google.com/linux/linux_signing_key.pub | sudo apt-key add -
          echo "deb [arch=amd64] http://dl.google.com/linux/chrome/deb/ stable main" | sudo tee /etc/apt/sources.list.d/google-chrome.list
          sudo apt-get update
          sudo apt-get install -y google-chrome-stable

      - name: Instalar Chromedriver compatível (Chrome for Testing)
        run: |
          set -eux
          CHROME_VERSION=$(google-chrome --version | grep -oP '\d+\.\d+\.\d+\.\d+')
          JSON=$(curl -s https://googlechromelabs.github.io/chrome-for-testing/last-known-good-versions-with-downloads.json)
          DRIVER_URL=$(echo "$JSON" | python3 -c "
          import sys, json
          ver = '$CHROME_VERSION'
          data = json.load(sys.stdin)
          url = None
          for channel in data['channels'].values():
              if channel['version'] == ver:
                  for d in channel['downloads']['chromedriver']:
                      if d['platform'] == 'linux64':
                          url = d['url']
                          break
          if not url:
              for d in data['channels']['Stable']['downloads']['chromedriver']:
                  if d['platform'] == 'linux64':
                      url = d['url']
                      break
          if url:
              print(url)
          else:
              exit(1)
          ")
          wget -O chromedriver.zip "$DRIVER_URL"
          unzip chromedriver.zip
          sudo mv chromedriver-linux64/chromedriver /usr/local/bin/chromedriver
          sudo chmod +x /usr/local/bin/chromedriver

      - name: Executar script com tentativas
        run: |
          for i in {1..3}; do
            echo "Tentativa $i/3"
            if python reserva.py; then
              echo "Script executado com sucesso"
              break
            else
              echo "Falhou, tentando novamente..."
              sleep 5
            fi
          done

      - name: Salvar arquivos de debug como artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-artifacts
          path: |
            pagina_debug.html
            debug.png
