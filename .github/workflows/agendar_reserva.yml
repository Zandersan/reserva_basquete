on:
  schedule:
    - cron: '0 6,9,12,15,18 * * *'
  workflow_dispatch:

jobs:
  reserva:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install selenium

      - name: Instalar Google Chrome
        run: |
          sudo apt-get update
          wget -q -O - https://dl.google.com/linux/linux_signing_key.pub | sudo apt-key add -
          echo "deb [arch=amd64] http://dl.google.com/linux/chrome/deb/ stable main" | sudo tee /etc/apt/sources.list.d/google-chrome.list
          sudo apt-get update
          sudo apt-get install -y google-chrome-stable

      - name: Instalar Chromedriver compatível (Chrome for Testing)
        run: |
          set -eux
          CHROME_VERSION=$(google-chrome --version | grep -oP '\d+\.\d+\.\d+\.\d+')
          # Baixa o JSON de releases do Chrome for Testing
          JSON=$(curl -s https://googlechromelabs.github.io/chrome-for-testing/last-known-good-versions-with-downloads.json)
          # Extrai o download URL do chromedriver para a versão correta
          DRIVER_URL=$(echo "$JSON" | python3 -c "
import sys, json
ver = '$CHROME_VERSION'
data = json.load(sys.stdin)
for channel in data['channels'].values():
    if channel['version'] == ver:
        for d in channel['downloads']['chromedriver']:
            if d['platform'] == 'linux64':
                print(d['url'])
                exit(0)
exit(1)
")
          wget -O chromedriver.zip "$DRIVER_URL"
          unzip chromedriver.zip
          sudo mv chromedriver-linux64/chromedriver /usr/local/bin/chromedriver
          sudo chmod +x /usr/local/bin/chromedriver

      - name: Executar script com tentativas
        run: |
          export DISPLAY=:0
          for i in {1..3}; do
            echo "Tentativa $i/3"
            if python reserva.py; then
              echo "Script executado com sucesso"
              break
            else
              echo "Falhou, tentando novamente..."
              sleep 5
            fi
          done
